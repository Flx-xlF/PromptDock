<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f232b" />
      <stop offset="100%" stop-color="#111317" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect x="6" y="6" width="116" height="116" rx="26" fill="url(#bgGrad)" stroke="#2b3240" stroke-width="3" />
  
  <!-- Subtle Inner Border / Accent Glow -->
  <rect x="10" y="10" width="108" height="108" rx="22" fill="none" stroke="url(#accentGrad)" stroke-width="2.5" stroke-opacity="0.8" />

  <!-- AI Prompt Symbol: Modern Chevron/Prompt + 4-Point AI Spark -->
  <!-- Prompt Chevron '>' -->
  <path d="M 34 42 L 54 64 L 34 86" fill="none" stroke="url(#accentGrad)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />

  <!-- AI Star / Sparkle in Top-Right Center -->
  <path d="M 82 36 Q 82 52 98 52 Q 82 52 82 68 Q 82 52 66 52 Q 82 52 82 36 Z" fill="url(#sparkleGrad)" filter="url(#glow)" />

  <!-- Prompt Cursor Underline '_' -->
  <line x1="58" y1="86" x2="88" y2="86" stroke="#60a5fa" stroke-width="8" stroke-linecap="round" />
</svg>
