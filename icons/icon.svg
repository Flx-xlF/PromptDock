<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Dark Cosmic Obsidian-Violet Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f1432" />
      <stop offset="100%" stop-color="#0d0818" />
    </linearGradient>
    
    <!-- Accent Border Gradient: Electric Violet -> Neon Fuchsia -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Chevron 1 Gradient (Violet) -->
    <linearGradient id="chev1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d8b4fe" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Chevron 2 Gradient (Fuchsia) -->
    <linearGradient id="chev2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Sparkle Glow Gradient -->
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#fdf2f8" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect x="6" y="6" width="116" height="116" rx="26" fill="url(#bgGrad)" stroke="#3b2554" stroke-width="2.5" />
  
  <!-- Subtle Inner Border / Accent Glow -->
  <rect x="9.5" y="9.5" width="109" height="109" rx="23" fill="none" stroke="url(#borderGrad)" stroke-width="2.5" stroke-opacity="0.9" />

  <!-- Multi-Turn Workflow Symbol: Double Chevron '>>' -->
  <!-- Turn 1: Left Chevron (Violet) -->
  <path d="M 22 42 L 44 64 L 22 86" fill="none" stroke="url(#chev1Grad)" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Turn 2: Right Chevron (Fuchsia) -->
  <path d="M 46 42 L 68 64 L 46 86" fill="none" stroke="url(#chev2Grad)" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- AI Star / Sparkle in Top-Right Center -->
  <path d="M 90 32 Q 90 44 102 44 Q 90 44 90 56 Q 90 44 78 44 Q 90 44 90 32 Z" fill="url(#sparkleGrad)" filter="url(#glow)" />

  <!-- '2' Workflow Edition Mark in Bottom Right -->
  <path d="M 77 70 L 95 70 L 95 77 L 77 88 L 98 88" fill="none" stroke="#f472b6" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round" />
</svg>
